[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "zazen-tui"
version = "0.1.0"
description = "Minimalist Zazen & Kinhin meditation TUI with a rotating spiral, singing bowl audio, and Dracula dark theme."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "GPL-3.0-only" }
authors = [
    { name = "postsonde" }
]
keywords = ["tui", "textual", "zazen", "zen", "meditation", "timer", "dracula", "linux", "terminal"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Utilities",
]
dependencies = [
    "textual>=0.80.0",
]

[project.urls]
Homepage = "https://github.com/postsonde/zazen-tui"
Repository = "https://github.com/postsonde/zazen-tui"
Issues = "https://github.com/postsonde/zazen-tui/issues"

[project.scripts]
zazen = "zazen_tui:main"

[tool.setuptools]
py-modules = ["zazen_tui"]


